<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a Wishlist | Wrapped Wishes</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
      <section>
        <p>A LITTLE PLACE FOR ALL YOUR WISHES</p>
        <h1>Create a wishlist worth sharing.</h1>
        <p>
          Gather all the things you've been dreaming of in one place. Add your
          favourite finds, share your wishlist, and let the people who matter
          know exactly what would make you smile.
        </p>
     
<form id="wishlist-form">

    <label for="wishlist-name">Wishlist name</label>
    <input type="text" id="wishlist-name" required>

    <label for="wishlist-description">Description</label>
    <textarea id="wishlist-description"></textarea>

    <label for="occasion">Occasion</label>
    <select id="occasion" required>
        <option value="">Choose an occasion</option>
        <option value="Birthday">Birthday</option>
        <option value="Wedding">Wedding</option>
        <option value="Graduation">Graduation</option>
        <option value="Anniversary">Anniversary</option>
        <option value="Other">Other</option>
    </select>
    <div class="gift-container">
    <label for="item-name">Gift name</label>
    <input class="gift-name" type="text" id="item-name" required>

    <label for="item-link">Gift link</label>
    <input class="gift-link" type="url" id="item-link">
    </div>
    <button type="button" id="add-button">Add another gift</button>

    <button type="submit">Create Wishlist</button>

</form>

      </section>
    </main>
    <script src="js/wishlist.js"></script>
  </body>
</html>
